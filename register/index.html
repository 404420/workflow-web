<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowSync - Registreeri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #050505; }
    .glow { background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.14), transparent 42%); }
    .code-modal { opacity: 0; pointer-events: none; transition: opacity .24s ease; }
    .code-modal.is-open { opacity: 1; pointer-events: auto; }
    .code-panel { opacity: 0; transform: translateY(18px) scale(.94); transition: opacity .24s ease, transform .32s cubic-bezier(.16,1,.3,1); }
    .code-modal.is-open .code-panel { opacity: 1; transform: translateY(0) scale(1); }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="fixed inset-0 glow"></div>
  <main class="relative z-10 grid min-h-screen place-items-center px-5 py-10">
    <section class="w-full max-w-md rounded-[32px] border border-white/10 bg-white/[0.045] p-6 shadow-2xl backdrop-blur-2xl md:p-8">
      <a href="../" class="block text-center text-3xl font-extrabold tracking-tight">FlowSync</a>
      <p class="mt-3 text-center text-sm leading-relaxed text-white/50">Loo konto, et tellimusi ja AI workflow lahendusi hallata.</p>

      <form id="register-form" class="mt-8 space-y-4">
        <label class="block"><span class="text-sm font-semibold text-white/70">Nimi</span><input id="name" type="text" autocomplete="name" required placeholder="Sinu nimi" class="mt-2 w-full rounded-2xl border border-white/10 bg-black/40 px-4 py-4 text-white outline-none transition placeholder:text-white/25 focus:border-white/35" /></label>
        <label class="block"><span class="text-sm font-semibold text-white/70">Email</span><input id="email" type="email" autocomplete="email" required placeholder="sinu@email.ee" class="mt-2 w-full rounded-2xl border border-white/10 bg-black/40 px-4 py-4 text-white outline-none transition placeholder:text-white/25 focus:border-white/35" /></label>
        <label class="block"><span class="text-sm font-semibold text-white/70">Salasõna</span><input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="••••••••••••" class="mt-2 w-full rounded-2xl border border-white/10 bg-black/40 px-4 py-4 text-white outline-none transition placeholder:text-white/25 focus:border-white/35" /></label>
        <button id="register-button" type="submit" class="w-full rounded-2xl bg-white px-5 py-4 font-bold text-black transition hover:scale-[1.02]">Loo konto</button>
      </form>

      <div id="auth-message" class="mt-6 hidden rounded-2xl border p-4 text-sm"></div>
      <p class="mt-6 text-center text-sm text-white/50">Konto olemas? <a href="../login/" class="font-semibold text-white hover:text-white/70">Logi sisse</a></p>
    </section>
  </main>

  <div id="code-modal" class="code-modal fixed inset-0 z-50 grid place-items-center bg-black/75 px-5 backdrop-blur-md" aria-hidden="true">
    <section class="code-panel w-full max-w-md rounded-[32px] border border-white/10 bg-[#080808] p-6 shadow-2xl md:p-8">
      <div class="text-center text-3xl font-extrabold tracking-tight">FlowSync</div>
      <h2 class="mt-6 text-center text-2xl font-extrabold">Kinnita email</h2>
      <p id="code-copy" class="mt-3 text-center text-sm leading-relaxed text-white/55">Konto loodud. Kontrolli emaili ja kinnita konto enne sisselogimist.</p>
      <form id="code-form" class="mt-7 space-y-4">
        <label class="block">
          <span class="text-sm font-semibold text-white/70">Kinnituskood</span>
          <input id="verification-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" class="mt-2 w-full rounded-2xl border border-white/10 bg-black/50 px-4 py-4 text-center text-2xl font-extrabold tracking-[0.35em] text-white outline-none transition placeholder:text-white/20 focus:border-white/35" />
        </label>
        <button id="verify-button" type="submit" class="w-full rounded-2xl bg-white px-5 py-4 font-bold text-black transition hover:scale-[1.02]">Kinnita ja logi sisse</button>
      </form>
      <button id="resend-code" type="button" class="mt-4 w-full rounded-2xl border border-white/10 px-5 py-4 font-semibold text-white/75 transition hover:bg-white/10 hover:text-white">Saada kood uuesti</button>
      <div id="code-message" class="mt-5 hidden rounded-2xl border p-4 text-sm"></div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = 'https://ibzwvcjtbiksvacraglv.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_IzI8q6zNgA6yzbgpr0b0Dg_rESAMlfX';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById('register-form');
    const message = document.getElementById('auth-message');
    const registerButton = document.getElementById('register-button');
    const codeModal = document.getElementById('code-modal');
    const codeForm = document.getElementById('code-form');
    const codeInput = document.getElementById('verification-code');
    const verifyButton = document.getElementById('verify-button');
    const codeMessage = document.getElementById('code-message');
    const resendButton = document.getElementById('resend-code');
    let pendingEmail = '';

    function showMessage(element, text, type = 'info') {
      element.textContent = text;
      element.className = `mt-6 rounded-2xl border p-4 text-sm ${type === 'error' ? 'border-red-400/30 bg-red-400/10 text-red-100' : 'border-white/10 bg-white/10 text-white/70'}`;
    }

    function showCodeMessage(text, type = 'info') {
      codeMessage.textContent = text;
      codeMessage.className = `mt-5 rounded-2xl border p-4 text-sm ${type === 'error' ? 'border-red-400/30 bg-red-400/10 text-red-100' : 'border-white/10 bg-white/10 text-white/70'}`;
    }

    function openCodeModal() {
      codeModal.classList.add('is-open');
      codeModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      setTimeout(() => codeInput.focus(), 120);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      registerButton.disabled = true;
      registerButton.textContent = 'Loon kontot...';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      pendingEmail = email;
      const { error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name },
          emailRedirectTo: `${window.location.origin}/workflow-web/dashboard/`
        }
      });
      registerButton.disabled = false;
      registerButton.textContent = 'Loo konto';
      if (error) {
        showMessage(message, error.message, 'error');
        return;
      }
      showMessage(message, 'Konto loodud. Kontrolli emaili ja kinnita konto enne sisselogimist.');
      openCodeModal();
    });

    codeForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const token = codeInput.value.trim();
      if (!pendingEmail || token.length < 6) {
        showCodeMessage('Sisesta emailile saadetud 6-kohaline kinnituskood.', 'error');
        return;
      }
      verifyButton.disabled = true;
      verifyButton.textContent = 'Kinnitan...';
      const { error } = await client.auth.verifyOtp({ email: pendingEmail, token, type: 'email' });
      if (error) {
        showCodeMessage(error.message, 'error');
        verifyButton.disabled = false;
        verifyButton.textContent = 'Kinnita ja logi sisse';
        return;
      }
      showCodeMessage('Email kinnitatud. Suunan dashboardile...');
      window.location.href = '../dashboard/';
    });

    resendButton.addEventListener('click', async () => {
      if (!pendingEmail) {
        showCodeMessage('Email puudub. Loo konto uuesti või sisesta email registreerimisvormi.', 'error');
        return;
      }
      resendButton.disabled = true;
      resendButton.textContent = 'Saadan...';
      const { error } = await client.auth.resend({ type: 'signup', email: pendingEmail });
      resendButton.disabled = false;
      resendButton.textContent = 'Saada kood uuesti';
      if (error) {
        showCodeMessage(error.message, 'error');
        return;
      }
      showCodeMessage('Uus kinnituskood saadeti emailile.');
    });
  </script>
</body>
</html>
