<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowSync - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,sans-serif;background:#050505}.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px)}</style>
</head>
<body class="min-h-screen text-white">
  <main class="mx-auto max-w-6xl px-5 py-8">
    <nav class="flex items-center justify-between border-b border-white/10 pb-5">
      <a href="../" class="text-2xl font-extrabold">FlowSync</a>
      <button id="logout" class="rounded-xl bg-white px-4 py-2 text-sm font-bold text-black transition hover:scale-105">Logi välja</button>
    </nav>

    <section class="py-12">
      <div class="card rounded-[32px] p-8 md:p-10">
        <div class="text-sm font-bold uppercase tracking-wide text-white/40">Admin paneel</div>
        <h1 class="mt-3 text-4xl font-extrabold tracking-tight">Tere tulemast, <span id="user-email">...</span></h1>
        <p class="mt-4 max-w-2xl text-white/55">Supabase Auth sessioon töötab. Siia saab järgmisena lisada päringute tabeli, klientide halduse ja AI workflow seadistused.</p>
      </div>

      <div class="mt-6 grid gap-4 md:grid-cols-3">
        <div class="card rounded-3xl p-6"><div class="text-3xl font-extrabold">0</div><div class="mt-2 text-white/50">Uut päringut</div></div>
        <div class="card rounded-3xl p-6"><div class="text-3xl font-extrabold">0</div><div class="mt-2 text-white/50">Aktiivset workflow'd</div></div>
        <div class="card rounded-3xl p-6"><div class="text-3xl font-extrabold">Auth</div><div class="mt-2 text-white/50">Supabase ühendatud</div></div>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://ibzwvcjtbiksvacraglv.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_IzI8q6zNgA6yzbgpr0b0Dg_rESAMlfX';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    async function init() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) {
        window.location.href = '../login/';
        return;
      }
      document.getElementById('user-email').textContent = session.user.email || 'kasutaja';
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await client.auth.signOut();
      window.location.href = '../login/';
    });

    init();
  </script>
</body>
</html>
